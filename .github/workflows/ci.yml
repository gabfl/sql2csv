name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: my_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_password
          POSTGRES_DB: my_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U db_user"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Import MySQL schema
        run: mysql -h 127.0.0.1 -uroot -proot my_db < schema/mysql.sql
      - name: Import PostgreSQL schema
        run: psql -h 127.0.0.1 -U db_user -d my_db -f schema/postgresql.sql
        env:
          PGPASSWORD: db_password
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pycodestyle coverage pytest
          python -m pip install .
      - name: Run pycodestyle
        run: pycodestyle --exclude=venv,build --ignore=E501 src
      - name: Run pytest
        run: coverage run -m pytest
      - name: Coverage report
        run: |
          coverage report -m
          coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build sdist and wheel
        run: |
          python -m pip install -U build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
